<!DOCTYPE html>
<html lang="id" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard RKEF - PT CERIA METALINDO PRIMA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root{ --font-body: 'Segoe UI', sans-serif; }

        /* ===== Mode: Dark (default) ===== */
        body[data-mode="dark"]{
            --bg:#121212; --panel:#1e1e1e; --panel-2:#262626; --border:#333333;
            --text:#e0e0e0; --text-dim:#9aa0a6; --text-faint:#6b7178;
            --accent:#00d4ff; --accent-dim: rgba(0,212,255,0.14);
            --accent-2:#ff5fa2; --accent-3:#ffc107;
            --grid-line: rgba(255,255,255,0.10); --topbar-bg: rgba(18,18,18,0.88);
            --stripe: rgba(255,255,255,0.035);
            color-scheme: dark;
        }
        /* ===== Mode: Light ===== */
        body[data-mode="light"]{
            --bg:#F1F4F8; --panel:#FFFFFF; --panel-2:#F4F6F9; --border:#DBE1E8;
            --text:#191E24; --text-dim:#525C68; --text-faint:#818B96;
            --accent:#0E93A8; --accent-dim: rgba(14,147,168,0.12);
            --accent-2:#C23A75; --accent-3:#B9750C;
            --grid-line: rgba(0,0,0,0.10); --topbar-bg: rgba(255,255,255,0.88);
            --stripe: rgba(0,0,0,0.025);
            color-scheme: light;
        }

        *{ box-sizing:border-box; }
        body{
            background-color: var(--bg) !important; color: var(--text) !important;
            font-family: var(--font-body); transition: background-color .2s ease, color .2s ease;
            overflow-x: hidden;
        }

        /* ===== Topbar / brand ===== */
        .topbar{
            position: sticky; top: 0; z-index: 40;
            background: var(--topbar-bg); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border); padding: 12px 20px; margin-bottom: 24px;
        }
        .topbar-inner{
            max-width: 1600px; margin: 0 auto; display: flex; align-items: center;
            justify-content: space-between; gap: 16px; flex-wrap: wrap;
        }
        .brand{ display:flex; align-items:center; gap:14px; }
        .brand-logo{ height:42px; width:auto; max-width:170px; object-fit:contain; flex:none; }
        .brand-text h1{
            font-size: 1.25rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px;
            margin: 0; color: var(--text); border-left: 5px solid var(--accent); padding-left: 12px;
        }
        .brand-text p{ margin: 3px 0 0 17px; font-size: .78rem; color: var(--text-dim); letter-spacing: .5px; }
        .mode-toggle{
            display: flex; align-items: center; gap: 7px; background: var(--panel);
            border: 1px solid var(--border); color: var(--text-dim); font-size: .82rem;
            padding: 8px 14px; border-radius: 8px; cursor: pointer; transition: border-color .15s ease, color .15s ease;
        }
        .mode-toggle:hover{ color: var(--text); border-color: var(--accent); }
        .theme-controls{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
        .theme-select{
            background: var(--panel); border: 1px solid var(--border); color: var(--text-dim);
            font-size: .82rem; padding: 8px 12px; border-radius: 8px; cursor: pointer; outline: none;
        }
        .theme-select:focus{ border-color: var(--accent); }

        .card { background-color: var(--panel) !important; border: 1px solid var(--border); color: var(--text); border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.15); margin-bottom: 20px; }
        .chart-container { height: 350px; width: 100%; }
        .kpi-card { text-align: center; padding: 15px; }
        .kpi-value { font-size: 1.5rem; font-weight: bold; color: var(--accent); }

        /* Form controls ikut tema (mengganti kelas bg-dark/text-white/border-secondary bawaan) */
        .form-control, .form-select{
            background-color: var(--panel-2) !important; color: var(--text) !important;
            border: 1px solid var(--border) !important;
        }
        .form-control:focus, .form-select:focus{
            background-color: var(--panel-2) !important; color: var(--text) !important;
            border-color: var(--accent) !important; box-shadow: 0 0 0 .2rem var(--accent-dim) !important;
        }
        .form-control::placeholder{ color: var(--text-faint); }
        .form-label{ color: var(--text-dim); }
        .text-secondary{ color: var(--text-dim) !important; }
        .text-info{ color: var(--accent) !important; }

        /* Tabel data ikut tema — TAPI kategori dropdown/kolom (opt-yellow/opt-red/opt-black)
           TETAP pakai warna aslinya (tidak ikut tema), sesuai permintaan */
        .table { color: var(--text) !important; }
        .table > :not(caption) > * > *{ background-color: transparent; color: var(--text); border-color: var(--border) !important; }
        .table-striped > tbody > tr:nth-of-type(odd) > *{ background-color: var(--stripe); color: var(--text); box-shadow: none; }
        .table-bordered, .table-bordered th, .table-bordered td{ border-color: var(--border) !important; }
        .opt-yellow { background-color: #fff3cd !important; color: #856404 !important; }
        .opt-red { background-color: #f8d7da !important; color: #721c24 !important; }
        .opt-black { background-color: #343a40 !important; color: #ffffff !important; }

        /* Tabel data utama dibuat ringkas & tetap di dalam kartunya (scroll horizontal),
           bukan melebar ke seluruh halaman — supaya rapi & tetap kebaca di HP */
        #dataTableWrap{ overflow-x: auto; -webkit-overflow-scrolling: touch; max-width: 100%; border-radius: 8px; }
        #dataTable{ font-size: .78rem; white-space: nowrap; }
        #dataTable th, #dataTable td{ padding: .45rem .55rem; vertical-align: middle; }
        #dataTable td{ color: var(--text); }
        .dataTables_wrapper .dataTables_length, .dataTables_wrapper .dataTables_filter,
        .dataTables_wrapper .dataTables_info, .dataTables_wrapper .dataTables_paginate{
            color: var(--text-dim); font-size: .82rem;
        }
        .dataTables_wrapper .dataTables_filter input{
            background-color: var(--panel-2); color: var(--text); border: 1px solid var(--border);
        }
        .dataTables_wrapper .dataTables_length select{
            background-color: var(--panel-2); color: var(--text); border: 1px solid var(--border);
        }
        .dataTables_wrapper .page-link{ background-color: var(--panel-2); color: var(--text); border-color: var(--border); }
        .dataTables_wrapper .page-item.active .page-link{ background-color: var(--accent); border-color: var(--accent); color: #04141B; }
        .dataTables_wrapper .page-item.disabled .page-link{ background-color: var(--panel); color: var(--text-faint); }

        @media (max-width: 576px){
            .brand-text h1{ font-size: 1.02rem; }
            .brand-text p{ margin-left: 17px; }
            .topbar{ padding: 10px 14px; }
            .dashboard-title-old{ display:none; }
        }
    </style>
</head>

<script>
    // ==== KONFIGURASI SINKRONISASI GOOGLE SHEET ====
    // Isi dengan URL Web App Apps Script (lihat file "Apps_Script_Backend.gs" & panduan setup).
    // Contoh: "https://script.google.com/macros/s/AKfycb.../exec"
    const SHEET_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwqCSlambWGv4YnCotSq3M0MyAQD2fqok-o59TqE_8pV_UGhws-ez31ud9b97Q_Kq7U/exec";
    const AUTO_REFRESH_MINUTES = 5; // set 0 untuk mematikan auto-refresh

    // Merapikan format tanggal apa pun (ISO timestamp, "1 Sep 2025", dll) jadi "yyyy-MM-dd"
    function normalizeDateKey(val) {
        if (val === null || val === undefined || val === '') return val;
        let s = String(val);
        if (s.indexOf('T') !== -1) s = s.split('T')[0]; // buang bagian jam ISO
        if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s; // sudah rapi
        const d = new Date(s);
        if (!isNaN(d.getTime())) {
            const yyyy = d.getFullYear();
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        }
        return s;
    }

    // Nilai dianggap TIDAK VALID (dikeluarkan dari rata-rata) jika: kosong, error (#DIV/0! dst), teks non-angka, atau nol
    function validNum(val) {
        if (val === null || val === undefined || val === '') return null;
        if (typeof val === 'string') {
            const s = val.trim();
            if (s === '' || s.startsWith('#') || s.toUpperCase() === 'N/A' || s.toUpperCase() === 'NA') return null;
        }
        const num = parseFloat(val);
        if (isNaN(num) || num === 0) return null;
        return num;
    }

    async function loadFromSheet(showAlertOnError) {
        const statusEl = document.getElementById('syncStatus');
        if (!SHEET_WEBAPP_URL || SHEET_WEBAPP_URL.indexOf('PASTE_URL') !== -1) {
            statusEl.innerText = 'URL Apps Script belum diisi di dalam file HTML.';
            return;
        }
        statusEl.innerText = 'Memuat data dari Google Sheet...';
        try {
            const res = await fetch(SHEET_WEBAPP_URL + '?t=' + Date.now());
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const json = await res.json();
            if (!Array.isArray(json)) throw new Error('Format data tidak sesuai (bukan array)');
            rawData = json.map(item => ({ ...item, Date: normalizeDateKey(item.Date) }));
            processData();
            const now = new Date();
            statusEl.innerText = 'Tersinkron: ' + now.toLocaleTimeString('id-ID') + ' — ' + rawData.length + ' baris data.';
        } catch (err) {
            statusEl.innerText = 'Gagal sinkron: ' + err.message;
            if (showAlertOnError) alert('Gagal memuat data dari Google Sheet:\n' + err.message + '\n\nPastikan URL Web App sudah benar dan sheet sudah di-deploy sebagai "Anyone can access".');
        }
    }

    let rawData = [], table, chart1, chart2, chart3;
    const params = [
        'Power', 'GHE', 'Calcine consume', 'Diesel consume', 'Paste consumtion', 'SCRAP Recycle', 
        'Temp Bottom', 'Impedance avg', '%Reductant Coal', 'sidewall temp', 'Freeboard temp', 
        'West pressure', 'East pressure', 'Ni Loss', 'Ni Product', 'Ni Grade/day', 'Temp Tapping', 
        'Scrap Generate', 'Product package', '%build up based packaging', 'Temp Skimming', 'Fe', 
        'Si/Mg', 'Skimming', 'Skimming up to 55 MW'
    ];

    const catYellow = [
        'Power', 'GHE', 'Calcine consume', 'Diesel consume', 'Paste consumtion', 'SCRAP Recycle', 
        'Temp Bottom', 'Impedance avg', '%Reductant Coal', 'sidewall temp', 'Freeboard temp', 
        'West pressure', 'East pressure'
    ];
    const catRed = ['Ni Loss', 'Ni Product', 'Ni Grade/day', 'Temp Tapping', 'Scrap Generate', 'Product package', '%build up based packaging'];
    const catBlack = ['Temp Skimming', 'Fe', 'Si/Mg', 'Skimming', 'Skimming up to 55 MW'];

    function getCellClass(p) { return catYellow.includes(p) ? 'opt-yellow' : (catRed.includes(p) ? 'opt-red' : 'opt-black'); }
    function parseLocalDate(dateStr) { return new Date(dateStr + 'T00:00:00'); }

    function initLayout() {
        let headHtml = '<tr><th>Date</th>' + params.map(p => `<th class="${getCellClass(p)}">${p}</th>`).join('') + '</tr>';
        document.getElementById('tableHead').innerHTML = headHtml;
        document.getElementById('statHead').innerHTML = headHtml;
        ['metric1', 'metric2', 'metric3a', 'metric3b', 'kpiAvgMetric', 'kpiTotalMetric'].forEach(id => {
            const el = document.getElementById(id);
            params.forEach(p => el.innerHTML += `<option class="${getCellClass(p)}" value="${p}">${p}</option>`);
        });
        // Default pilihan yang masuk akal untuk grafik 3 dan kartu KPI baru
        if (params.includes('Ni Product')) document.getElementById('metric3b').value = 'Ni Product';
        if (params.includes('Ni Product')) document.getElementById('kpiAvgMetric').value = 'Ni Product';
        if (params.includes('Temp Skimming')) document.getElementById('kpiTotalMetric').value = 'Temp Skimming';
        table = $('#dataTable').DataTable({ paging: true, searching: true });
    }

    // Analisis korelasi sederhana (Pearson) antara 2 metrik di grafik ketiga
    function pearsonCorrelation(xs, ys) {
        const n = xs.length;
        if (n < 3) return null;
        const meanX = xs.reduce((a, b) => a + b, 0) / n;
        const meanY = ys.reduce((a, b) => a + b, 0) / n;
        let num = 0, denX = 0, denY = 0;
        for (let i = 0; i < n; i++) {
            const dx = xs[i] - meanX, dy = ys[i] - meanY;
            num += dx * dy; denX += dx * dx; denY += dy * dy;
        }
        if (denX === 0 || denY === 0) return null;
        return num / Math.sqrt(denX * denY);
    }

    function correlationText(paramA, paramB, r) {
        if (r === null) return 'Data pasangan tidak cukup untuk analisis korelasi.';
        const abs = Math.abs(r);
        let strength = abs >= 0.7 ? 'kuat' : (abs >= 0.4 ? 'sedang' : (abs >= 0.2 ? 'lemah' : null));
        if (!strength) return `Tidak ada hubungan berarti antara "${paramA}" dan "${paramB}" (r=${r.toFixed(2)}).`;
        if (r > 0) return `Berkorelasi positif ${strength}: "${paramA}" naik → "${paramB}" cenderung ikut naik (r=${r.toFixed(2)}).`;
        return `Berkorelasi negatif ${strength}: "${paramA}" naik → "${paramB}" cenderung turun (r=${r.toFixed(2)}).`;
    }

    function handleFileUpload(event) {
        const reader = new FileReader();
        reader.onload = (e) => { rawData = JSON.parse(e.target.result).map(item => ({ ...item, Date: normalizeDateKey(item.Date) })); processData(); };
        reader.readAsText(event.target.files[0]);
    }

    function resetData() { document.getElementById('startDate').value = ''; document.getElementById('endDate').value = ''; processData(); }

    function processData() {
        let startVal = document.getElementById('startDate').value;
        let endVal = document.getElementById('endDate').value;
        
        let filtered = rawData.filter(item => {
            let itemDate = parseLocalDate(item.Date);
            let start = startVal ? parseLocalDate(startVal) : new Date(0);
            let end = endVal ? parseLocalDate(endVal) : new Date('9999-12-31');
            return itemDate >= start && itemDate <= end;
        });

        const mode = document.getElementById('timeGrouping').value;
        let grouped = {};
        filtered.forEach(item => {
            let d = new Date(item.Date);
            let key = item.Date;

            if (mode === 'weekly') { 
                let firstDay = new Date(d.setDate(d.getDate() - d.getDay())); 
                key = firstDay.toISOString().split('T')[0]; 
            }
            else if (mode === 'monthly') { 
                let options = { month: 'short', year: 'numeric' };
                key = d.toLocaleDateString('en-US', options); 
            }
            
            if (!grouped[key]) grouped[key] = { count: 0, sum: {}, valid: {} };
            grouped[key].count++;
            params.forEach(p => {
                const num = validNum(item[p]);
                if (num !== null) {
                    grouped[key].sum[p] = (grouped[key].sum[p] || 0) + num;
                    grouped[key].valid[p] = (grouped[key].valid[p] || 0) + 1;
                }
            });
        });

        let finalData = Object.keys(grouped).map(key => {
            let row = { Date: key };
            params.forEach(p => {
                const validCount = grouped[key].valid[p] || 0;
                row[p] = validCount > 0 ? (grouped[key].sum[p] / validCount) : null;
            });
            return row;
        });

        const totalGroups = finalData.length;
        if (totalGroups > 0) {
            const validVals = (p) => finalData.map(i => i[p]).filter(v => v !== null && v !== undefined && !isNaN(v));
            const avgOf = (p) => { const v = validVals(p); return v.length ? (v.reduce((a,b) => a+b, 0) / v.length) : 0; };
            const sumOf = (p) => finalData.reduce((acc, i) => acc + (i[p] || 0), 0);

            const avgMetric = document.getElementById('kpiAvgMetric').value;
            const totalMetric = document.getElementById('kpiTotalMetric').value;
            document.getElementById('kpiNi').innerText = avgOf(avgMetric).toFixed(2);
            document.getElementById('kpiTemp').innerText = sumOf(totalMetric).toFixed(0);
            document.getElementById('kpiTotal').innerText = totalGroups;
            document.getElementById('kpiPack').innerText = sumOf('Product package').toFixed(0);
            document.getElementById('kpiScrap').innerText = sumOf('Scrap Generate').toFixed(0);

            // Analisis korelasi untuk grafik ketiga
            const m3a = document.getElementById('metric3a').value;
            const m3b = document.getElementById('metric3b').value;
            const pairXs = [], pairYs = [];
            finalData.forEach(i => {
                const a = i[m3a], b = i[m3b];
                if (a !== null && a !== undefined && !isNaN(a) && b !== null && b !== undefined && !isNaN(b)) {
                    pairXs.push(a); pairYs.push(b);
                }
            });
            const r = pearsonCorrelation(pairXs, pairYs);
            document.getElementById('kpiCorrelation').innerText = correlationText(m3a, m3b, r);
        } else {
            ['kpiNi', 'kpiTemp', 'kpiTotal', 'kpiPack', 'kpiScrap'].forEach(id => document.getElementById(id).innerText = "0");
            document.getElementById('kpiCorrelation').innerText = '-';
        }

        table.destroy();
        let bodyHtml = finalData.map(item => `<tr><td>${item.Date}</td>${params.map(p => {
            const v = item[p];
            return `<td>${(v === null || v === undefined || isNaN(v)) ? '-' : v.toFixed(2)}</td>`;
        }).join('')}</tr>`).join('');
        $('#dataTable tbody').remove();
        $('#dataTable').append('<tbody>' + bodyHtml + '</tbody>');
        table = $('#dataTable').DataTable({ paging: true, searching: true });

        const validColVals = (p) => finalData.map(i => i[p]).filter(v => v !== null && v !== undefined && !isNaN(v));
        let statBody = `<tr><td>Max</td>${params.map(p => { const v = validColVals(p); return `<td class="${getCellClass(p)}">${v.length ? Math.max(...v).toFixed(1) : '-'}</td>`; }).join('')}</tr>`;
        statBody += `<tr><td>Min</td>${params.map(p => { const v = validColVals(p); return `<td class="${getCellClass(p)}">${v.length ? Math.min(...v).toFixed(1) : '-'}</td>`; }).join('')}</tr>`;
        statBody += `<tr><td>Avg</td>${params.map(p => { const v = validColVals(p); return `<td class="${getCellClass(p)}">${v.length ? (v.reduce((a,b) => a+b, 0) / v.length).toFixed(1) : '-'}</td>`; }).join('')}</tr>`;
        document.getElementById('statBody').innerHTML = statBody;

        [chart1, chart2].forEach((chart, idx) => {
            let m = document.getElementById(idx === 0 ? 'metric1' : 'metric2').value;
            chart.data.labels = finalData.map(i => i.Date);
            chart.data.datasets[0].data = finalData.map(i => { const v = i[m]; return (v === null || v === undefined || isNaN(v)) ? null : v; });
            chart.data.datasets[0].label = m;
            chart.update();
        });

        const m3a2 = document.getElementById('metric3a').value;
        const m3b2 = document.getElementById('metric3b').value;
        chart3.data.labels = finalData.map(i => i.Date);
        chart3.data.datasets[0].data = finalData.map(i => { const v = i[m3a2]; return (v === null || v === undefined || isNaN(v)) ? null : v; });
        chart3.data.datasets[0].label = m3a2;
        chart3.data.datasets[1].data = finalData.map(i => { const v = i[m3b2]; return (v === null || v === undefined || isNaN(v)) ? null : v; });
        chart3.data.datasets[1].label = m3b2;
        chart3.update();
    }

    // ==== Mesin tema warna (dropdown) ====
    // Sama seperti Production KPI Dashboard: tiap tema cukup didefinisikan lewat
    // 1 warna aksen utama + 1 warna aksen kedua, warna dasar (bg/panel/border)
    // dihitung otomatis dari hue warna aksen tsb — untuk mode gelap & terang.
    function hexToRgb(hex){
        hex = hex.replace("#","");
        if(hex.length===3) hex = hex.split("").map(c=>c+c).join("");
        const n = parseInt(hex,16);
        return { r:(n>>16)&255, g:(n>>8)&255, b:n&255 };
    }
    function rgbToHsl(r,g,b){
        r/=255; g/=255; b/=255;
        const max=Math.max(r,g,b), min=Math.min(r,g,b);
        let h,s,l=(max+min)/2;
        if(max===min){ h=s=0; }
        else{
            const d=max-min;
            s = l>0.5 ? d/(2-max-min) : d/(max+min);
            switch(max){
                case r: h=(g-b)/d+(g<b?6:0); break;
                case g: h=(b-r)/d+2; break;
                default: h=(r-g)/d+4;
            }
            h/=6;
        }
        return { h:h*360, s:s*100, l:l*100 };
    }
    function hslToHex(h,s,l){
        h=((h%360)+360)%360; s=Math.max(0,Math.min(100,s))/100; l=Math.max(0,Math.min(100,l))/100;
        const c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2;
        let r=0,g=0,b=0;
        if(h<60){r=c;g=x;b=0;} else if(h<120){r=x;g=c;b=0;} else if(h<180){r=0;g=c;b=x;}
        else if(h<240){r=0;g=x;b=c;} else if(h<300){r=x;g=0;b=c;} else {r=c;g=0;b=x;}
        const toHex=v=> Math.round((v+m)*255).toString(16).padStart(2,"0");
        return "#"+toHex(r)+toHex(g)+toHex(b);
    }
    function rgbaFromHex(hex, alpha){ const {r,g,b}=hexToRgb(hex); return `rgba(${r},${g},${b},${alpha})`; }
    function hslFromHex(hex){ const {r,g,b}=hexToRgb(hex); return rgbToHsl(r,g,b); }

    const THEMES = [
        { id:"default", label:"Default (Cyan)" }, // pakai CSS bawaan
        { id:"violet", label:"Violet Majesty", accent:"#7A5CFA", line:"#FF6E40" },
        { id:"crimson", label:"Red Chicory", accent:"#A73D4D", line:"#C9A227" },
        { id:"forest", label:"Midnight Forest", accent:"#053B2D", line:"#ADC6E4" },
        { id:"gold", label:"Sweet Curry", accent:"#D9A441", line:"#7A5CFA" },
        { id:"oxford", label:"Oxford Blue", accent:"#002147", line:"#D2B48C" },
        { id:"retro", label:"Retro Sunset", accent:"#D23D2D", line:"#F9C065" },
        { id:"pomegranate", label:"Pomegranate", accent:"#E64B2A", line:"#8DD0FC" },
        { id:"dynamicblack", label:"Dynamic Black", accent:"#FF5A1F", line:"#D9C9A3" },
        { id:"rustic", label:"Rustic Indulgence", accent:"#B92216", line:"#B7C6B8" },
        { id:"earthline", label:"Rustic Earthline", accent:"#783E30", line:"#B39070" },
        { id:"magma", label:"Magma Mist", accent:"#F06F0E", line:"#077771" },
        { id:"cosmicviolet", label:"Cosmic Violet & Solar Blaze", accent:"#400086", line:"#FF6E00" },
        { id:"sunbound", label:"Sunbound Majesty", accent:"#69326E", line:"#EED455" },
        { id:"darkred", label:"Cream & Dark Red", accent:"#941704", line:"#ADC6E4" }
    ];

    function computeThemeVars(theme, mode){
        const h = hslFromHex(theme.accent).h;
        const isDark = mode === "dark";
        const vars = {
            "--accent": theme.accent,
            "--accent-dim": rgbaFromHex(theme.accent, isDark ? 0.16 : 0.13),
            "--accent-2": theme.line,
            "--accent-3": theme.line
        };
        if(isDark){
            vars["--bg"] = hslToHex(h, 22, 6);
            vars["--panel"] = hslToHex(h, 20, 10);
            vars["--panel-2"] = hslToHex(h, 18, 13);
            vars["--border"] = hslToHex(h, 14, 21);
            vars["--grid-line"] = "rgba(255,255,255,0.10)";
            vars["--stripe"] = "rgba(255,255,255,0.035)";
            vars["--topbar-bg"] = rgbaFromHex(vars["--bg"], 0.88);
        }else{
            vars["--bg"] = hslToHex(h, 35, 97);
            vars["--panel"] = "#FFFFFF";
            vars["--panel-2"] = hslToHex(h, 30, 95);
            vars["--border"] = hslToHex(h, 24, 80);
            vars["--grid-line"] = "rgba(0,0,0,0.10)";
            vars["--stripe"] = "rgba(0,0,0,0.025)";
            vars["--topbar-bg"] = rgbaFromHex(vars["--bg"], 0.88);
            // garis grafik dibuat lebih gelap di light mode supaya tetap kontras di atas putih
            const lineHsl = hslFromHex(theme.line);
            vars["--accent-2"] = hslToHex(lineHsl.h, Math.max(lineHsl.s,40), Math.min(lineHsl.l,45));
            vars["--accent-3"] = vars["--accent-2"];
        }
        return vars;
    }

    let currentTheme = "default";
    function applyTheme(themeId, mode){
        const theme = THEMES.find(t=> t.id===themeId) || THEMES[0];
        currentTheme = theme.id;
        if(theme.id === "default"){
            ["--accent","--accent-dim","--accent-2","--accent-3","--bg","--panel","--panel-2",
             "--border","--grid-line","--stripe","--topbar-bg"
            ].forEach(prop=> document.body.style.removeProperty(prop));
            return;
        }
        const vars = computeThemeVars(theme, mode);
        Object.entries(vars).forEach(([k,v])=> document.body.style.setProperty(k, v));
    }
    function populateThemeSelect(){
        const select = document.getElementById("themeSelect");
        select.innerHTML = THEMES.map(t=> `<option value="${t.id}">${t.label}</option>`).join("");
        select.value = currentTheme;
    }
    document.getElementById("themeSelect").addEventListener("change", function(e){
        applyTheme(e.target.value, chartMode);
        applyChartTheme();
    });

    // ==== Tema (dark/light) untuk grafik Chart.js ====
    // Canvas tidak otomatis ikut CSS variable, jadi warnanya diambil manual dari
    // CSS variable yang aktif setiap kali mode diganti, lalu semua chart di-update().
    let chartMode = 'dark';
    function chartColors(){
        const cs = getComputedStyle(document.body);
        const v = (name, fb) => (cs.getPropertyValue(name) || '').trim() || fb;
        return {
            text: v('--text-dim', '#ffffff'),
            grid: v('--grid-line', '#444444'),
            accent: v('--accent', '#00d4ff'),
            accent2: v('--accent-2', '#ff5fa2'),
            accent3: v('--accent-3', '#ffc107')
        };
    }
    function hexToRgba(hex, alpha){
        hex = hex.trim();
        if(hex.startsWith('rgb')) return hex; // sudah rgba/rgb, dipakai apa adanya
        hex = hex.replace('#','');
        if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
        const n = parseInt(hex,16);
        const r=(n>>16)&255, g=(n>>8)&255, b=n&255;
        return `rgba(${r},${g},${b},${alpha})`;
    }
    function applyChartTheme(){
        const c = chartColors();
        if(chart1){
            chart1.options.scales.x.ticks.color = c.text;
            chart1.options.scales.x.grid.color = c.grid;
            chart1.options.scales.y.ticks.color = c.text;
            chart1.options.scales.y.grid.color = c.grid;
            chart1.options.plugins.legend.labels.color = c.text;
            chart1.data.datasets[0].borderColor = c.accent;
            chart1.data.datasets[0].backgroundColor = hexToRgba(c.accent, 0.12);
            chart1.update();
        }
        if(chart2){
            chart2.options.scales.x.ticks.color = c.text;
            chart2.options.scales.x.grid.color = c.grid;
            chart2.options.scales.y.ticks.color = c.text;
            chart2.options.scales.y.grid.color = c.grid;
            chart2.options.plugins.legend.labels.color = c.text;
            chart2.data.datasets[0].borderColor = c.accent3;
            chart2.data.datasets[0].backgroundColor = hexToRgba(c.accent3, 0.12);
            chart2.update();
        }
        if(chart3){
            chart3.options.scales.x.ticks.color = c.text;
            chart3.options.scales.x.grid.color = c.grid;
            chart3.options.scales.y.ticks.color = c.accent;
            chart3.options.scales.y.grid.color = c.grid;
            chart3.options.scales.y1.ticks.color = c.accent2;
            chart3.options.plugins.legend.labels.color = c.text;
            chart3.data.datasets[0].borderColor = c.accent;
            chart3.data.datasets[0].backgroundColor = hexToRgba(c.accent, 0.08);
            chart3.data.datasets[1].borderColor = c.accent2;
            chart3.data.datasets[1].backgroundColor = hexToRgba(c.accent2, 0.08);
            chart3.update();
        }
    }

    function applyModeUI(){
        const icon = document.getElementById('modeToggleIcon');
        const label = document.getElementById('modeToggleLabel');
        if(chartMode === 'light'){ icon.textContent = '☀️'; label.textContent = 'Light'; }
        else{ icon.textContent = '🌙'; label.textContent = 'Dark'; }
    }
    document.getElementById('modeToggle').addEventListener('click', function(){
        chartMode = chartMode === 'dark' ? 'light' : 'dark';
        document.body.setAttribute('data-mode', chartMode);
        document.documentElement.setAttribute('data-bs-theme', chartMode);
        applyTheme(currentTheme, chartMode);
        applyModeUI();
        applyChartTheme();
    });

    $(document).ready(function() {
        initLayout();
        const initColors = chartColors();
        const cfg = { 
            responsive: true, 
            maintainAspectRatio: false, 
            scales: { 
                x: { ticks: { color: initColors.text }, grid: { color: initColors.grid } }, 
                y: { ticks: { color: initColors.text }, grid: { color: initColors.grid } } 
            }, 
            plugins: { 
                legend: { labels: { color: initColors.text } } 
            } 
        };
        chart1 = new Chart(document.getElementById('chart1'), { type: 'line', data: { datasets: [{ borderColor: '#00d4ff', backgroundColor: 'rgba(0, 212, 255, 0.1)', fill: true, data: [] }] }, options: cfg });
        chart2 = new Chart(document.getElementById('chart2'), { type: 'line', data: { datasets: [{ borderColor: '#ffc107', backgroundColor: 'rgba(255, 193, 7, 0.1)', fill: true, data: [] }] }, options: JSON.parse(JSON.stringify(cfg)) });

        const cfgDual = {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            scales: {
                x: { ticks: { color: initColors.text }, grid: { color: initColors.grid } },
                y: { type: 'linear', position: 'left', ticks: { color: initColors.accent }, grid: { color: initColors.grid } },
                y1: { type: 'linear', position: 'right', ticks: { color: initColors.accent2 }, grid: { drawOnChartArea: false } }
            },
            plugins: { legend: { labels: { color: initColors.text } } }
        };
        chart3 = new Chart(document.getElementById('chart3'), {
            type: 'line',
            data: { datasets: [
                { borderColor: '#00d4ff', backgroundColor: 'rgba(0,212,255,0.08)', fill: false, yAxisID: 'y', data: [] },
                { borderColor: '#ff5fa2', backgroundColor: 'rgba(255,95,162,0.08)', fill: false, yAxisID: 'y1', data: [] }
            ] },
            options: cfgDual
        });

        applyModeUI();
        populateThemeSelect();
        applyChartTheme();
        loadFromSheet(false);

        // Auto-refresh berkala
        if (AUTO_REFRESH_MINUTES > 0) {
            setInterval(() => loadFromSheet(false), AUTO_REFRESH_MINUTES * 60 * 1000);
        }
    });
</script>
